              headsetUnworn = false''')

          assert s.count('fantoStartNative(recoveryMedia.copy(startPositionMs = 440000L))') == 1
          assert s.count('private var fantoV11RecoveryUsed') == 1
          source.write_text(s, encoding='utf-8')

          gradle = Path('mobile/android/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          old = 'resValue "string", "app_name", "Immuch360 FANTO v9 TEST"'
          if g.count(old) != 1:
              raise SystemExit(f'FANTO v11 STOP: app label mismatch ({g.count(old)})')
          gradle.write_text(g.replace(old,
              'resValue "string", "app_name", "Immuch360 FANTO v11 TEST"', 1), encoding='utf-8')
          print('FANTO v11: small fault-handler-only patch applied')
          FANTO_V11_PY

      - name: FANTO v12 TEST - zachowaj ostatni kadr w trakcie wznowienia
        run: |
          python3 - <<'FANTO_V12_PATCH'
          from pathlib import Path

          # Modify only the v11 recovery UI (not its playback pipeline).
          source = Path('mobile/android/app/src/main/kotlin/app/alextran/immich/immersive/ImmersiveViewerActivity.kt')
          s = source.read_text(encoding='utf-8')
          before = '''          fantoDiagnosticError = false
                    hideFeedback()
                    videoRevealed = false
                    videoEntity?.setComponent(Visible(false))
                    setStatus(getString(R.string.immersive_loading))
                    scope.launch {'''
          after = '''          fantoDiagnosticError = false
                    hideFeedback()
                    // FANTO v12: hold the last frame on the immersive video Surface
                    // until a fresh MediaPlayer writes its first new frame.
                    // Keep the existing video sphere visible; do not reset videoRevealed.
                    Log.i(TAG, "FANTO v12: keep last video frame during native restart")
                    scope.launch {'''
          count = s.count(before)
          print(f'FANTO v12 recovery UI anchor: {count} match(es)')
          if count != 1:
              raise SystemExit('FANTO v12: unexpected v11 source; refusing to change playback')
          s = s.replace(before, after, 1)
          assert s.count('fantoStartNative(recoveryMedia.copy(startPositionMs = 440000L))') == 1
          assert s.count('delay(1800L)') == 1
          source.write_text(s, encoding='utf-8')

          gradle = Path('mobile/android/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          old = 'resValue "string", "app_name", "Immuch360 FANTO v11 TEST"'
          if g.count(old) != 1:
              raise SystemExit('FANTO v12: v11 app label mismatch')
          gradle.write_text(g.replace(old, 'resValue "string", "app_name", "Immuch360 FANTO v12 TEST"', 1), encoding='utf-8')
          print('FANTO v12: preserve last visible frame, retain v11 decoder recovery logic')
          FANTO_V12_PATCH

      - name: Zbuduj APK na Quest Pro (oddzielna aplikacja)
        working-directory: mobile
        env:
          PR_NUMBER: '366'
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise exec -- flutter build apk --release --flavor quest --target-platform android-arm64 --android-project-arg arm64only=true
          ls -lh build/app/outputs/flutter-apk/app-quest-release.apk

      - name: Udostępnij gotowe APK
        uses: actions/upload-artifact@v4
        with:
          name: Immuch360-FANTO-v12-TEST-APK
          path: mobile/build/app/outputs/flutter-apk/app-quest-release.apk
          retention-days: 30
