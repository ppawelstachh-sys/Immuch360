name: Immuch360 FANTO v6 TEST - Android MediaPlayer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quest-pro-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz dokładnie wersję 3.3.0-rc.0-25
        uses: actions/checkout@v4
        with:
          repository: freeKC/Immuch360
          ref: v3.3.0-rc.0-25
          persist-credentials: false

      - name: Pobierz lokalne zasoby FANTO z własnego repozytorium
        uses: actions/checkout@v4
        with:
          path: fanto-custom
          sparse-checkout: |
            fanto_outro_360.png
            fanto_outro_card.png
          sparse-checkout-cone-mode: false

      - name: Zainstaluj narzędzie mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: Pobierz Flutter, Java, Node i generator
        env:
          MISE_YES: '1'
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise install node java "npm:@openapitools/openapi-generator-cli"
          cd mobile
          mise install

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Wygeneruj wymagany kod projektu
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise //mobile:install:ci
          mise //mobile:codegen

      - name: Dodaj restart filmu po zalozeniu gogli (FANTO v2)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source = Path('mobile/android/app/src/main/kotlin/app/alextran/immich/immersive/ImmersiveViewerActivity.kt')
          if not source.is_file():
              sys.exit(f'Nie znaleziono pliku odtwarzacza: {source}')
          content = source.read_text(encoding='utf-8')

          # Kotwice sprawdzone w źródłach wersji v3.3.0-rc.0-25.
          # Nie dopasowujemy całych komentarzy: ich zmiana powodowała awarię poprzedniej wersji skryptu.
          changes = [
              (
                  '  private var playOnReturn = false',
                  '  private var playOnReturn = false\n'
                  '  /** FANTO: remembers a real headset removal, not system menu focus changes. */\n'
                  '  private var headsetUnworn = false',
                  'pole playOnReturn',
              ),
              (
                  '  private fun playbackAllowed(): Boolean = resumed && focused',
                  '  private fun playbackAllowed(): Boolean = resumed && focused && !headsetUnworn',
                  'warunek playbackAllowed',
              ),
              (
                  '  override fun onSessionStateChanged(state: SessionState) {',
                  '  /** FANTO: pause when the headset is removed. */\n'
                  '  override fun onHMDUnmounted() {\n'
                  '    super.onHMDUnmounted()\n'
                  '    headsetUnworn = true\n'
                  '    holdPlayback()\n'
                  '  }\n\n'
                  '  /** FANTO: restart from zero whenever the next visitor puts the headset on. */\n'
                  '  override fun onHMDMounted() {\n'
                  '    super.onHMDMounted()\n'
                  '    if (!headsetUnworn) return\n'
                  '    headsetUnworn = false\n'
                  '    if (request?.isVideo == true && currentVideoUrl != null) {\n'
                  '      player?.seekTo(0L)\n'
                  '      playOnReturn = true\n'
                  '    }\n'
                  '    resumeHeldPlayback()\n'
                  '  }\n\n'
                  '  override fun onSessionStateChanged(state: SessionState) {',
                  'obsługa stanu sesji',
              ),
          ]
          for old, new, label in changes:
              count = content.count(old)
              print(f'Szukam: {label}: {count} dopasowan')
              if count != 1:
                  sys.exit(f'Wersja kodu nie pasuje: {label} ({count} dopasowan). Przerwano bez zapisywania zmian.')
              content = content.replace(old, new, 1)

          assert content.count('override fun onHMDMounted()') == 1
          assert content.count('override fun onHMDUnmounted()') == 1
          source.write_text(content, encoding='utf-8')
          print('SUKCES: dodano obsluge zdejmowania i zakladania gogli')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/android/app/build.gradle')
          content = p.read_text(encoding='utf-8')
          old = 'resValue "string", "app_name", "Immich PR ${prNumber}"'
          count = content.count(old)
          if count != 1:
              raise SystemExit(f'Nie udalo sie ustalic nazwy oddzielnej aplikacji: {count} dopasowan')
          p.write_text(content.replace(old, 'resValue "string", "app_name", "Immuch360 FANTO"', 1), encoding='utf-8')
          print('SUKCES: ustawiono nazwe Immuch360 FANTO')
          PY

      - name: FANTO - czarne podziekowanie, ukryte rece i panel odtwarzania
        run: |
          test -f fanto-custom/fanto_outro_360.png || { echo 'BRAK fanto_outro_360.png w głównym katalogu Twojego forka'; exit 1; }
          mkdir -p mobile/android/app/src/main/res/drawable-nodpi
          cp fanto-custom/fanto_outro_360.png mobile/android/app/src/main/res/drawable-nodpi/fanto_outro_360.png
          python3 - <<'PYTHONPATCH'
          #!/usr/bin/env python3
          """Immuch360 v3.3.0-rc.0-25, after the working FANTO v2 restart patch.
          Experimental, test on Meta Quest Pro before public use.
          """
          from pathlib import Path
          
          src = Path('mobile/android/app/src/main/kotlin/app/alextran/immich/immersive/ImmersiveViewerActivity.kt')
          if not src.is_file():
              raise SystemExit(f'Brak źródła: {src}')
          s = src.read_text(encoding='utf-8')
          
          
          def once(label, old, new):
              global s
              n = s.count(old)
              print(f'{label}: {n} dopasowań')
              if n != 1:
                  raise SystemExit(f'Kod nie pasuje do oryginalnej wersji ({label}). Nie zapisano zmian.')
              s = s.replace(old, new, 1)
          
          once('AvatarSystem import',
               'import com.meta.spatial.toolkit.AppSystemActivity',
               'import com.meta.spatial.toolkit.AvatarSystem\nimport com.meta.spatial.isdk.IsdkSystem\nimport com.meta.spatial.toolkit.AppSystemActivity')
          
          once('Stan ekranu końcowego',
               '  private var playOnReturn = false',
               '  private var playOnReturn = false\n'
               '  /** FANTO: after video completion, show a static black 360-degree thank-you card. */\n'
               '  private var fantoOutroVisible = false')
          
          once('Ukrycie postaci dłoni i kontrolerów',
               '      systemManager.registerSystem(ImmersiveInputSystem(this))',
               '      systemManager.registerSystem(ImmersiveInputSystem(this))\n'
               '      // FANTO kiosk: no hand/controller meshes or rays in the immersive viewer.\n'
               '      try {\n'
               '        systemManager.findSystem<AvatarSystem>().apply {\n'
               '          setShowHands(false)\n'
               '          setShowControllers(false)\n'
               '        }\n'
               '      } catch (e: Exception) {\n'
               '        Log.w(TAG, "FANTO: avatar visibility configuration failed", e)\n'
               '      }\n'
               '      try {\n'
               '        systemManager.findSystem<IsdkSystem>().active = false\n'
               '      } catch (e: Exception) {\n'
               '        Log.w(TAG, "FANTO: cursor disable failed", e)\n'
               '      }')
          
          once('Zresetuj ekran końcowy przy wyborze następnego pliku',
               '  private fun showRequest(revealInfo: Boolean = true) {\n    val media = request',
               '  private fun showRequest(revealInfo: Boolean = true) {\n'
               '    fantoOutroVisible = false\n'
               '    val media = request')
          
          once('Ukryj pasek przy otwieraniu filmu',
               '    if (revealInfo) setInfoVisible(true, reposition = true)',
               '    if (media.isVideo) setInfoVisible(false, reposition = false)\n'
               '    else if (revealInfo) setInfoVisible(true, reposition = true)')
          
          once('Blokowanie panelu odtwarzania podczas pokazu',
               '  private fun setInfoVisible(visible: Boolean, reposition: Boolean) {',
               '  private fun setInfoVisible(visible: Boolean, reposition: Boolean) {\n'
               '    // FANTO: never show the transport panel on top of a public 360 video.\n'
               '    if (visible && request?.isVideo == true) return')
          
          start = '  override fun onButtonsPressed(controllerBits: Int, handBits: Int) {'
          end = '  @Deprecated("Deprecated in Java")\n  override fun onBackPressed()'
          if s.count(start) != 1 or s.count(end) != 1 or s.index(start) > s.index(end):
              raise SystemExit('Nie znaleziono jednoznacznie obsługi przycisków. Nie zapisano zmian.')
          i,j=s.index(start),s.index(end)
          s=s[:i] + '''  // FANTO: ignore guest hands/controller gestures. Keep only B/Y exit for an operator.
            override fun onButtonsPressed(controllerBits: Int, handBits: Int) {
              val actions = ImmersiveControls.actionsFor(controllerBits, handBits, false)
              if (ImmersiveControls.Action.CLOSE in actions) close()
            }
          ''' + s[j:]
          print('Obsługa przycisków: ograniczona do wyjścia')
          
          once('Wyłącz pętlę filmu',
               '        it.repeatMode = Player.REPEAT_MODE_ONE',
               '        it.repeatMode = Player.REPEAT_MODE_OFF')
          
          once('Zabezpiecz odtwarzacz przed odkryciem filmu podczas napisu końcowego',
               '  private fun revealVideo() {\n    if (videoRevealed',
               '  private fun revealVideo() {\n    if (fantoOutroVisible) return\n    if (videoRevealed')
          
          once('Obsługa zakończenia filmu',
               '          Player.STATE_BUFFERING -> setStatus(getString(R.string.immersive_buffering))',
               '          Player.STATE_BUFFERING -> setStatus(getString(R.string.immersive_buffering))\n'
               '          Player.STATE_ENDED -> showFantoOutro()')
          
          intro = '''  /** FANTO: full black panorama with supplied logo and thanks, retained until the next HMD mount. */
            private fun showFantoOutro() {
              if (fantoOutroVisible || request?.isVideo != true) return
              fantoOutroVisible = true
              playOnReturn = false
              setInfoVisible(false, reposition = false)
              hideFeedback()
              // Do not keep the last video frame above the black background.
              videoRevealed = false
              videoEntity?.setComponent(Visible(false))
              halfSphereEntity?.setComponent(Visible(false))
              val bitmap = BitmapFactory.decodeResource(resources, R.drawable.fanto_outro_360)
              if (bitmap != null) {
                try {
                  applySkyboxBitmap(bitmap) // consumes the bitmap and resets the material texture
                  setSkyboxStereoMode(StereoMode.None) // the card must be identical for both eyes
                } catch (e: Exception) {
                  Log.e(TAG, "FANTO outro texture failed", e)
                }
              }
              skyboxEntity?.setComponent(Visible(true))
              Log.i(TAG, "FANTO: showing end screen until the next visitor wears the headset")
            }
          '''
          once('Wstaw ekran końcowy',
               '  private val playerListener =\n    object : Player.Listener {',
               intro+'  private val playerListener =\n    object : Player.Listener {')
          
          once('Schowaj ekran końcowy przy nowym widzu',
               '    if (request?.isVideo == true && currentVideoUrl != null) {\n      player?.seekTo(0L)',
               '    if (fantoOutroVisible) {\n'
               '      fantoOutroVisible = false\n'
               '      skyboxEntity?.setComponent(Visible(false))\n'
               '      videoEntity?.setComponent(Visible(false))\n'
               '      videoRevealed = false\n'
               '    }\n'
               '    if (request?.isVideo == true && currentVideoUrl != null) {\n      player?.seekTo(0L)')
          
          if s.count('override fun onHMDMounted()') != 1 or s.count('override fun onHMDUnmounted()') != 1:
              raise SystemExit('Niepoprawna liczba metod HMD! Nie zapisano zmian.')
          src.write_text(s, encoding='utf-8')
          print('SUKCES: FANTO v3 code patch applied.')
          PYTHONPATCH
          python3 - <<'PYTHONNAME'
          from pathlib import Path
          p=Path('mobile/android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          old='resValue "string", "app_name", "Immuch360 FANTO"'
          assert s.count(old) == 1, 'Nie znaleziono nazwy bazowej FANTO'
          p.write_text(s.replace(old,'resValue "string", "app_name", "Immuch360 FANTO Pokazy v5"',1), encoding='utf-8')
          PYTHONNAME

      - name: FANTO v5 - plansza na wprost spojrzenia
        run: |
          test -f fanto-custom/fanto_outro_card.png || { echo 'Brak grafiki fanto_outro_card.png w glownym katalogu forka'; exit 1; }
          mkdir -p mobile/android/app/src/main/res/drawable-nodpi
          cp fanto-custom/fanto_outro_card.png mobile/android/app/src/main/res/drawable-nodpi/fanto_outro_card.png
          mkdir -p mobile/android/app/src/main/res/values mobile/android/app/src/main/res/layout
          cat > mobile/android/app/src/main/res/values/fanto_outro_ids.xml <<'FANTO_IDS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <item type="id" name="fanto_outro_panel" />
          </resources>
          FANTO_IDS
          cat > mobile/android/app/src/main/res/layout/fanto_outro_panel.xml <<'FANTO_PANEL'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <ImageView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:contentDescription="Dziękujemy za wspólną podróż"
                  android:scaleType="fitCenter"
                  android:src="@drawable/fanto_outro_card" />
          </FrameLayout>
          FANTO_PANEL
          python3 - <<'FANTO_PY'
          from pathlib import Path
          import re
          
          p = Path('mobile/android/app/src/main/kotlin/app/alextran/immich/immersive/ImmersiveViewerActivity.kt')
          s = p.read_text(encoding='utf-8')
          
          def once(label, before, after):
              global s
              n=s.count(before)
              print(f'{label}: {n} dopasowan')
              if n != 1:
                  raise SystemExit(f'Blad kompatybilnosci: {label}. Oczekiwano dokladnie jednego dopasowania, znaleziono {n}.')
              s=s.replace(before, after, 1)
          
          once('Pole panelu koncowego',
               '  private var fantoOutroVisible = false',
               '  private var fantoOutroVisible = false\n  /** FANTO v5: separate spatial UI panel placed at the last viewer head direction. */\n  private var fantoOutroEntity: Entity? = null')
          
          once('Schowanie panelu przy wyborze nowego filmu',
               '    fantoOutroVisible = false\n    val media = request',
               '    fantoOutroVisible = false\n    fantoOutroEntity?.setComponent(Visible(false))\n    val media = request')
          
          once('Utworzenie panelu w scenie VR',
               '      systemManager.registerSystem(ImmersiveInputSystem(this))',
               '''      fantoOutroEntity =
                  Entity.createPanelEntity(
                    R.id.fanto_outro_panel,
                    Transform(Pose(Vector3(0f, 1.1f, 2.25f), Quaternion(0f, 0f, 0f))),
                    Visible(false),
                  )
                systemManager.registerSystem(ImmersiveInputSystem(this))''')
          
          once('Rejestracja plaskiej planszy FANTO',
               '    // 360 video: equirectangular compositor layer, as in MediaPlayerSample.',
               '''    // FANTO v5: 2D outro panel, positioned with the viewer's actual head pose at the end.
              LayoutXMLPanelRegistration(
                R.id.fanto_outro_panel,
                layoutIdCreator = { R.layout.fanto_outro_panel },
                settingsCreator = {
                  UIPanelSettings(
                    shape = QuadShapeOptions(width = 2.8f, height = 1.6f),
                    style = PanelStyleOptions(themeResourceId = R.style.ImmersivePanelTheme),
                    display = DpDisplayOptions(width = 1400f, height = 800f, dpi = 260),
                  )
                },
                panelSetupWithRootView = { _, _, _ -> },
              ),
              // 360 video: equirectangular compositor layer, as in MediaPlayerSample.''')
          
          # Working FANTO v3 code already handles end-of-film, turning off loops, and all VR controls.
          # Replace only the end-of-film content (previously a panorama texture) by a plain black
          # sphere plus a real 2D panel at the current, normalized gaze direction.
          start='  private fun showFantoOutro() {'
          end='  private val playerListener ='
          if s.count(start)!=1 or s.count(end)!=1 or s.index(start)>s.index(end):
              raise SystemExit('Nie odnaleziono jednoznacznie metody showFantoOutro()')
          a=s.index(start)
          b=s.index(end, a)
          replacement='''  private fun showFantoOutro() {
              if (fantoOutroVisible || request?.isVideo != true) return
              fantoOutroVisible = true
              playOnReturn = false
              setInfoVisible(false, reposition = false)
              hideFeedback()
              videoRevealed = false
              videoEntity?.setComponent(Visible(false))
              halfSphereEntity?.setComponent(Visible(false))
          
              // Surround the visitor with pure black, not the last video frame.
              try {
                val black = android.graphics.Bitmap.createBitmap(16, 8, android.graphics.Bitmap.Config.ARGB_8888)
                black.eraseColor(android.graphics.Color.BLACK)
                applySkyboxBitmap(black)
                setSkyboxStereoMode(StereoMode.None)
                skyboxEntity?.setComponent(Visible(true))
              } catch (e: Exception) {
                Log.e(TAG, "FANTO: could not prepare black environment", e)
              }
          
              // Use the HEAD pose captured by onFrame(), not the fixed room orientation.
              val head = lastHeadPosition ?: Vector3(0f, 1.6f, 0f)
              val f = lastHeadForward ?: Vector3(0f, 0f, 1f)
              val length = sqrt(f.x * f.x + f.y * f.y + f.z * f.z)
              val direction =
                if (length < 1e-3f) Vector3(0f, 0f, 1f)
                else Vector3(f.x / length, f.y / length, f.z / length)
              val pos = head + (direction * 2.25f)
              fantoOutroEntity?.apply {
                setComponent(Transform(Pose(pos, Quaternion.lookRotation(direction))))
                setComponent(Visible(true))
              }
              Log.i(TAG, "FANTO v5: outro panel in front of the viewer, fixed until next wearer")
            }
          '''
          s=s[:a]+replacement+s[b:]
          print('SUKCES: dynamiczna plansza zamiast stalej panoramy')
          
          once('Ukrycie planszy przed następnym odtworzeniem',
               '      skyboxEntity?.setComponent(Visible(false))\n      videoEntity?.setComponent(Visible(false))',
               '      skyboxEntity?.setComponent(Visible(false))\n      fantoOutroEntity?.setComponent(Visible(false))\n      videoEntity?.setComponent(Visible(false))')
          
          assert s.count('private fun showFantoOutro()') == 1
          assert s.count('override fun onHMDMounted()') == 1
          assert s.count('R.id.fanto_outro_panel') == 2
          p.write_text(s, encoding='utf-8')
          print('FANTO v5: zmiany kodu gotowe')
          FANTO_PY

      - name: FANTO v6 TEST - systemowy MediaPlayer dla lokalnych filmow 360
        run: |
          python3 - <<'FANTO_NATIVE_PY'
          #!/usr/bin/env python3
          """FANTO v6 TEST: Android MediaPlayer local-video path for Meta Quest.

          Expected input: upstream Immuch360 v3.3.0-rc.0-25 after the working FANTO v5 patches.
          Fails closed if source anchors differ.
          """
          from pathlib import Path
          p = Path('mobile/android/app/src/main/kotlin/app/alextran/immich/immersive/ImmersiveViewerActivity.kt')
          s = p.read_text(encoding='utf-8')

          def once(label, before, after):
              global s
              count=s.count(before)
              print(f'FANTO v6 {label}: {count} matches')
              if count != 1:
                  raise SystemExit(f'FANTO v6: abort; source mismatch for {label}, expected exactly 1.')
              s=s.replace(before, after, 1)

          # No extra dependencies; Android's MediaPlayer is part of the Quest runtime.
          once('Android MediaPlayer import',
           'import android.net.Uri',
           'import android.net.Uri\nimport android.media.MediaPlayer\nimport android.media.AudioAttributes as AndroidAudioAttributes')

          once('Native video state',
           '  private var videoSurface: Surface? = null',
           '''  private var videoSurface: Surface? = null
            /** FANTO v6 TEST: separate system media pipeline for LOCAL equirectangular MP4s. */
            private var fantoNative: MediaPlayer? = null
            private var fantoNativeReady = false
            private var fantoNativeUrl: String? = null''')

          once('Attach native player to immersive video surface',
           '          videoSurface = surface\n          player?.let { attachVideoSurface(it, surface) }',
           '''          videoSurface = surface
                    fantoNative?.let { native ->
                      try { native.setSurface(surface) }
                      catch (e: Exception) { Log.e(TAG, "FANTO native setSurface failed", e) }
                    }
                    player?.let { attachVideoSurface(it, surface) }''')

          # Prefer native only for the original, normal, local videos. Keep all streaming, raw lens, stereo etc in upstream.
          # Content URIs and file URIs are the app's normal local media paths.
          new_methods = '''
            // ---------------------------------------------------------------------------------------------
            // FANTO v6 TEST: Android platform MediaPlayer for ordinary local 360 videos.
            // Immuch360 Media3/ExoPlayer can play audio yet fail to render video on some Quest/Horizon OS
            // combinations. This experiment bypasses that renderer for local equirectangular files only,
            // sending the decoded video to the SAME Spatial SDK VideoSurfacePanelRegistration Surface.
            private fun fantoUseNative(media: MediaRequest): Boolean {
              if (!media.isVideo || media.isRawVideo) return false
              val scheme = Uri.parse(media.url).scheme?.lowercase()
              return scheme == "file" || scheme == "content"
            }

            private fun fantoReleaseNative() {
              val old = fantoNative
              fantoNative = null
              fantoNativeReady = false
              fantoNativeUrl = null
              if (old != null) {
                try { old.reset() } catch (_: Exception) {}
                try { old.release() } catch (_: Exception) {}
              }
            }

            private fun fantoStartNative(media: MediaRequest) {
              fantoReleaseNative()
              releasePlayer() // Only one pipeline may own the MediaPanel Surface.
              val url = media.url
              currentVideoUrl = url
              playOnReturn = false
              decoderWarning = null
              Log.i(TAG, "FANTO v6: native Android MediaPlayer for local 360 video")
              try {
                val native = MediaPlayer()
                fantoNative = native
                fantoNativeUrl = url
                native.setAudioAttributes(
                  AndroidAudioAttributes.Builder()
                    .setUsage(AndroidAudioAttributes.USAGE_MEDIA)
                    .setContentType(AndroidAudioAttributes.CONTENT_TYPE_MOVIE)
                    .build()
                )
                native.setOnPreparedListener { ready ->
                  if (ready !== fantoNative || currentVideoUrl != url) return@setOnPreparedListener
                  fantoNativeReady = true
                  if (media.startPositionMs > 0L) {
                    ready.seekTo(media.startPositionMs.coerceAtMost(Int.MAX_VALUE.toLong()).toInt())
                  }
                  Log.i(TAG, "FANTO v6 native prepared: duration=${ready.duration} ms")
                  if (playbackAllowed()) ready.start() else playOnReturn = true
                  updateProgress()
                }
                native.setOnInfoListener { active, code, _ ->
                  if (active === fantoNative && code == MediaPlayer.MEDIA_INFO_VIDEO_RENDERING_START) {
                    Log.i(TAG, "FANTO v6 native first video frame")
                    revealVideo()
                    true
                  } else false
                }
                native.setOnCompletionListener { completed ->
                  if (completed === fantoNative) showFantoOutro()
                }
                native.setOnErrorListener { failed, what, extra ->
                  if (failed === fantoNative) {
                    Log.e(TAG, "FANTO v6 native playback error $what/$extra")
                    showError("FANTO native MediaPlayer error $what/$extra")
                  }
                  true
                }
                videoSurface?.let { native.setSurface(it) }
                native.setDataSource(this, Uri.parse(url))
                native.prepareAsync()
              } catch (e: Exception) {
                Log.e(TAG, "FANTO v6 native media preparation failed", e)
                fantoReleaseNative()
                showError("FANTO native player: ${e.javaClass.simpleName}")
              }
            }

          '''
          once('Insert native pipeline helpers',
           '  private fun showVideo(media: MediaRequest) {',
           new_methods + '  private fun showVideo(media: MediaRequest) {')

          once('Stop previous native video when starting another',
           '  private fun showVideo(media: MediaRequest) {\n    hideStereoQuad()',
           '  private fun showVideo(media: MediaRequest) {\n    fantoReleaseNative()\n    hideStereoQuad()')

          once('Start native local path before ExoPlayer setup',
           '''    setStatus(getString(R.string.immersive_loading))
              if (ensurePlayer(media.url, media) == null) {''',
           '''    setStatus(getString(R.string.immersive_loading))
