name: Immuch360 FANTO - wersja wystawiennicza

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quest-pro-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz dokładnie wersję 3.3.0-rc.0-25
        uses: actions/checkout@v4
        with:
          repository: freeKC/Immuch360
          ref: v3.3.0-rc.0-25
          persist-credentials: false

      - name: Pobierz lokalne zasoby FANTO z własnego repozytorium
        uses: actions/checkout@v4
        with:
          path: fanto-custom
          sparse-checkout: fanto_outro_360.png
          sparse-checkout-cone-mode: false

      - name: Zainstaluj narzędzie mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: Pobierz Flutter, Java, Node i generator
        env:
          MISE_YES: '1'
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise install node java "npm:@openapitools/openapi-generator-cli"
          cd mobile
          mise install

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Wygeneruj wymagany kod projektu
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise //mobile:install:ci
          mise //mobile:codegen

      - name: Dodaj restart filmu po zalozeniu gogli (FANTO v2)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source = Path('mobile/android/app/src/main/kotlin/app/alextran/immich/immersive/ImmersiveViewerActivity.kt')
          if not source.is_file():
              sys.exit(f'Nie znaleziono pliku odtwarzacza: {source}')
          content = source.read_text(encoding='utf-8')

          # Kotwice sprawdzone w źródłach wersji v3.3.0-rc.0-25.
          # Nie dopasowujemy całych komentarzy: ich zmiana powodowała awarię poprzedniej wersji skryptu.
          changes = [
              (
                  '  private var playOnReturn = false',
                  '  private var playOnReturn = false\n'
                  '  /** FANTO: remembers a real headset removal, not system menu focus changes. */\n'
                  '  private var headsetUnworn = false',
                  'pole playOnReturn',
              ),
              (
                  '  private fun playbackAllowed(): Boolean = resumed && focused',
                  '  private fun playbackAllowed(): Boolean = resumed && focused && !headsetUnworn',
                  'warunek playbackAllowed',
              ),
              (
                  '  override fun onSessionStateChanged(state: SessionState) {',
                  '  /** FANTO: pause when the headset is removed. */\n'
                  '  override fun onHMDUnmounted() {\n'
                  '    super.onHMDUnmounted()\n'
                  '    headsetUnworn = true\n'
                  '    holdPlayback()\n'
                  '  }\n\n'
                  '  /** FANTO: restart from zero whenever the next visitor puts the headset on. */\n'
                  '  override fun onHMDMounted() {\n'
                  '    super.onHMDMounted()\n'
                  '    if (!headsetUnworn) return\n'
                  '    headsetUnworn = false\n'
                  '    if (request?.isVideo == true && currentVideoUrl != null) {\n'
                  '      player?.seekTo(0L)\n'
                  '      playOnReturn = true\n'
                  '    }\n'
                  '    resumeHeldPlayback()\n'
                  '  }\n\n'
                  '  override fun onSessionStateChanged(state: SessionState) {',
                  'obsługa stanu sesji',
              ),
          ]
          for old, new, label in changes:
              count = content.count(old)
              print(f'Szukam: {label}: {count} dopasowan')
              if count != 1:
                  sys.exit(f'Wersja kodu nie pasuje: {label} ({count} dopasowan). Przerwano bez zapisywania zmian.')
              content = content.replace(old, new, 1)

          assert content.count('override fun onHMDMounted()') == 1
          assert content.count('override fun onHMDUnmounted()') == 1
          source.write_text(content, encoding='utf-8')
          print('SUKCES: dodano obsluge zdejmowania i zakladania gogli')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/android/app/build.gradle')
          content = p.read_text(encoding='utf-8')
          old = 'resValue "string", "app_name", "Immich PR ${prNumber}"'
          count = content.count(old)
          if count != 1:
              raise SystemExit(f'Nie udalo sie ustalic nazwy oddzielnej aplikacji: {count} dopasowan')
          p.write_text(content.replace(old, 'resValue "string", "app_name", "Immuch360 FANTO"', 1), encoding='utf-8')
          print('SUKCES: ustawiono nazwe Immuch360 FANTO')
          PY

      - name: FANTO - czarne podziekowanie, ukryte rece i panel odtwarzania
        run: |
          test -f fanto-custom/fanto_outro_360.png || { echo 'BRAK fanto_outro_360.png w głównym katalogu Twojego forka'; exit 1; }
          mkdir -p mobile/android/app/src/main/res/drawable-nodpi
          cp fanto-custom/fanto_outro_360.png mobile/android/app/src/main/res/drawable-nodpi/fanto_outro_360.png
          python3 - <<'PYTHONPATCH'
          #!/usr/bin/env python3
          """Immuch360 v3.3.0-rc.0-25, after the working FANTO v2 restart patch.
          Experimental, test on Meta Quest Pro before public use.
          """
          from pathlib import Path
          
          src = Path('mobile/android/app/src/main/kotlin/app/alextran/immich/immersive/ImmersiveViewerActivity.kt')
          if not src.is_file():
              raise SystemExit(f'Brak źródła: {src}')
          s = src.read_text(encoding='utf-8')
          
          
          def once(label, old, new):
              global s
              n = s.count(old)
              print(f'{label}: {n} dopasowań')
              if n != 1:
                  raise SystemExit(f'Kod nie pasuje do oryginalnej wersji ({label}). Nie zapisano zmian.')
              s = s.replace(old, new, 1)
          
          once('AvatarSystem import',
               'import com.meta.spatial.toolkit.AppSystemActivity',
               'import com.meta.spatial.toolkit.AvatarSystem\nimport com.meta.spatial.isdk.IsdkSystem\nimport com.meta.spatial.toolkit.AppSystemActivity')
          
          once('Stan ekranu końcowego',
               '  private var playOnReturn = false',
               '  private var playOnReturn = false\n'
               '  /** FANTO: after video completion, show a static black 360-degree thank-you card. */\n'
               '  private var fantoOutroVisible = false')
          
          once('Ukrycie postaci dłoni i kontrolerów',
               '      systemManager.registerSystem(ImmersiveInputSystem(this))',
               '      systemManager.registerSystem(ImmersiveInputSystem(this))\n'
               '      // FANTO kiosk: no hand/controller meshes or rays in the immersive viewer.\n'
               '      try {\n'
               '        systemManager.findSystem<AvatarSystem>().apply {\n'
               '          setShowHands(false)\n'
               '          setShowControllers(false)\n'
               '        }\n'
               '      } catch (e: Exception) {\n'
               '        Log.w(TAG, "FANTO: avatar visibility configuration failed", e)\n'
               '      }\n'
               '      try {\n'
               '        systemManager.findSystem<IsdkSystem>().active = false\n'
               '      } catch (e: Exception) {\n'
               '        Log.w(TAG, "FANTO: cursor disable failed", e)\n'
               '      }')
          
          once('Zresetuj ekran końcowy przy wyborze następnego pliku',
               '  private fun showRequest(revealInfo: Boolean = true) {\n    val media = request',
               '  private fun showRequest(revealInfo: Boolean = true) {\n'
               '    fantoOutroVisible = false\n'
               '    val media = request')
          
          once('Ukryj pasek przy otwieraniu filmu',
               '    if (revealInfo) setInfoVisible(true, reposition = true)',
               '    if (media.isVideo) setInfoVisible(false, reposition = false)\n'
               '    else if (revealInfo) setInfoVisible(true, reposition = true)')
          
          once('Blokowanie panelu odtwarzania podczas pokazu',
               '  private fun setInfoVisible(visible: Boolean, reposition: Boolean) {',
               '  private fun setInfoVisible(visible: Boolean, reposition: Boolean) {\n'
               '    // FANTO: never show the transport panel on top of a public 360 video.\n'
               '    if (visible && request?.isVideo == true) return')
          
          start = '  override fun onButtonsPressed(controllerBits: Int, handBits: Int) {'
          end = '  @Deprecated("Deprecated in Java")\n  override fun onBackPressed()'
          if s.count(start) != 1 or s.count(end) != 1 or s.index(start) > s.index(end):
              raise SystemExit('Nie znaleziono jednoznacznie obsługi przycisków. Nie zapisano zmian.')
          i,j=s.index(start),s.index(end)
          s=s[:i] + '''  // FANTO: ignore guest hands/controller gestures. Keep only B/Y exit for an operator.
            override fun onButtonsPressed(controllerBits: Int, handBits: Int) {
              val actions = ImmersiveControls.actionsFor(controllerBits, handBits, false)
              if (ImmersiveControls.Action.CLOSE in actions) close()
            }
          ''' + s[j:]
          print('Obsługa przycisków: ograniczona do wyjścia')
          
          once('Wyłącz pętlę filmu',
               '        it.repeatMode = Player.REPEAT_MODE_ONE',
               '        it.repeatMode = Player.REPEAT_MODE_OFF')
          
          once('Zabezpiecz odtwarzacz przed odkryciem filmu podczas napisu końcowego',
               '  private fun revealVideo() {\n    if (videoRevealed',
               '  private fun revealVideo() {\n    if (fantoOutroVisible) return\n    if (videoRevealed')
          
          once('Obsługa zakończenia filmu',
               '          Player.STATE_BUFFERING -> setStatus(getString(R.string.immersive_buffering))',
               '          Player.STATE_BUFFERING -> setStatus(getString(R.string.immersive_buffering))\n'
               '          Player.STATE_ENDED -> showFantoOutro()')
          
          intro = '''  /** FANTO: full black panorama with supplied logo and thanks, retained until the next HMD mount. */
            private fun showFantoOutro() {
              if (fantoOutroVisible || request?.isVideo != true) return
              fantoOutroVisible = true
              playOnReturn = false
              setInfoVisible(false, reposition = false)
              hideFeedback()
              // Do not keep the last video frame above the black background.
              videoRevealed = false
              videoEntity?.setComponent(Visible(false))
              halfSphereEntity?.setComponent(Visible(false))
              val bitmap = BitmapFactory.decodeResource(resources, R.drawable.fanto_outro_360)
              if (bitmap != null) {
                try {
                  applySkyboxBitmap(bitmap) // consumes the bitmap and resets the material texture
                  setSkyboxStereoMode(StereoMode.None) // the card must be identical for both eyes
                } catch (e: Exception) {
                  Log.e(TAG, "FANTO outro texture failed", e)
                }
              }
              skyboxEntity?.setComponent(Visible(true))
              Log.i(TAG, "FANTO: showing end screen until the next visitor wears the headset")
            }
          '''
          once('Wstaw ekran końcowy',
               '  private val playerListener =\n    object : Player.Listener {',
               intro+'  private val playerListener =\n    object : Player.Listener {')
          
          once('Schowaj ekran końcowy przy nowym widzu',
               '    if (request?.isVideo == true && currentVideoUrl != null) {\n      player?.seekTo(0L)',
               '    if (fantoOutroVisible) {\n'
               '      fantoOutroVisible = false\n'
               '      skyboxEntity?.setComponent(Visible(false))\n'
               '      videoEntity?.setComponent(Visible(false))\n'
               '      videoRevealed = false\n'
               '    }\n'
               '    if (request?.isVideo == true && currentVideoUrl != null) {\n      player?.seekTo(0L)')
          
          if s.count('override fun onHMDMounted()') != 1 or s.count('override fun onHMDUnmounted()') != 1:
              raise SystemExit('Niepoprawna liczba metod HMD! Nie zapisano zmian.')
          src.write_text(s, encoding='utf-8')
          print('SUKCES: FANTO v3 code patch applied.')
          PYTHONPATCH
          python3 - <<'PYTHONNAME'
          from pathlib import Path
          p=Path('mobile/android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          old='resValue "string", "app_name", "Immuch360 FANTO"'
          assert s.count(old) == 1, 'Nie znaleziono nazwy bazowej FANTO'
          p.write_text(s.replace(old,'resValue "string", "app_name", "Immuch360 FANTO Pokazy"',1), encoding='utf-8')
          PYTHONNAME

      - name: Zbuduj APK na Quest Pro (oddzielna aplikacja)
        working-directory: mobile
        env:
          PR_NUMBER: '362'
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise exec -- flutter build apk --release --flavor quest --target-platform android-arm64 --android-project-arg arm64only=true
          ls -lh build/app/outputs/flutter-apk/app-quest-release.apk

      - name: Udostępnij gotowe APK
        uses: actions/upload-artifact@v4
        with:
          name: Immuch360-FANTO-Pokazy-APK
          path: mobile/build/app/outputs/flutter-apk/app-quest-release.apk
          retention-days: 7
