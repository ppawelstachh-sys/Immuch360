name: Immuch360 FANTO - wersja wystawiennicza

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quest-pro-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz dokładnie wersję 3.3.0-rc.0-25
        uses: actions/checkout@v4
        with:
          repository: freeKC/Immuch360
          ref: v3.3.0-rc.0-25
          persist-credentials: false

      - name: Zainstaluj narzędzie mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: Pobierz Flutter, Java, Node i generator
        env:
          MISE_YES: '1'
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise install node java "npm:@openapitools/openapi-generator-cli"
          cd mobile
          mise install

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Wygeneruj wymagany kod projektu
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise //mobile:install:ci
          mise //mobile:codegen

      - name: Dodaj restart filmu po założeniu gogli
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          # Immuch360 v3.3.0-rc.0-25: restart immersive playback when the headset is worn again.
          # Local source modification for Meta Quest. This script does not install an APK.
          from pathlib import Path
          import sys
          
          SOURCE = Path("mobile/android/app/src/main/kotlin/app/alextran/immich/immersive/ImmersiveViewerActivity.kt")
          
          def main():
              root = Path(sys.argv[1]).resolve() if len(sys.argv) > 1 else Path.cwd()
              source = root / SOURCE
              if not source.is_file():
                  sys.exit(f"Brak pliku: {source}\nUruchom skrypt z katalogu glownego kodu Immuch360 lub podaj katalog jako argument.")
              body = source.read_text(encoding="utf-8")
              if "private var headsetUnworn = false" in body:
                  sys.exit("Poprawka jest juz obecna — niczego nie zmieniono.")
              fixes = [
                  (
                      '  private var playOnReturn = false\n  /** The video track of the current url',
                      '  private var playOnReturn = false\n'
                      '  /** True only after an HMD unmount event; a system menu must not cause a restart. */\n'
                      '  private var headsetUnworn = false\n'
                      '  /** The video track of the current url',
                  ),
                  (
                      '  private fun playbackAllowed(): Boolean = resumed && focused',
                      '  private fun playbackAllowed(): Boolean = resumed && focused && !headsetUnworn',
                  ),
                  (
                      '  // ---------------------------------------------------------------------------------------------\n'
                      '  // Lifecycle\n'
                      '  /**\n'
                      '   * Pauses the video while the session has no input focus',
                      '  // ---------------------------------------------------------------------------------------------\n'
                      '  // Lifecycle\n'
                      '  /** Only the physical HMD handoff restarts a video. Losing focus to a menu does not. */\n'
                      '  override fun onHMDUnmounted() {\n'
                      '    super.onHMDUnmounted()\n'
                      '    headsetUnworn = true\n'
                      '    holdPlayback()\n'
                      '  }\n'
                      '  override fun onHMDMounted() {\n'
                      '    super.onHMDMounted()\n'
                      '    if (!headsetUnworn) return\n'
                      '    headsetUnworn = false\n'
                      '    if (currentVideoUrl != null) {\n'
                      '      player?.seekTo(0L)\n'
                      '      playOnReturn = true\n'
                      '    }\n'
                      '    resumeHeldPlayback()\n'
                      '  }\n'
                      '  /**\n'
                      '   * Pauses the video while the session has no input focus',
                  ),
              ]
              for old, new in fixes:
                  n = body.count(old)
                  if n != 1:
                      sys.exit(f"Nie znaleziono jednoznacznie fragmentu poprawki ({n} dopasowan). Plik nie zostal zmieniony. Sprawdz wersje kodu.")
                  body = body.replace(old, new, 1)
              backup = source.with_suffix('.kt.before-hmd-restart')
              backup.write_text(source.read_text(encoding='utf-8'), encoding='utf-8')
              source.write_text(body, encoding='utf-8')
              print(f"Zmieniono: {source}\nKopia poprzedniego pliku: {backup}\nTeraz nalezy zbudowac i przetestowac APK Meta Quest.")
          
          if __name__ == "__main__":
              main()
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/android/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          old = 'resValue "string", "app_name", "Immich PR ${prNumber}"'
          new = 'resValue "string", "app_name", "Immuch360 FANTO"'
          assert old in s, 'Nie znaleziono nazwy aplikacji. Sprawdź wersję.'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Zbuduj APK na Quest Pro (oddzielna aplikacja)
        working-directory: mobile
        env:
          PR_NUMBER: '360'
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise exec -- flutter build apk --release --flavor quest --target-platform android-arm64 --android-project-arg arm64only=true
          ls -lh build/app/outputs/flutter-apk/app-quest-release.apk

      - name: Udostępnij gotowe APK
        uses: actions/upload-artifact@v4
        with:
          name: Immuch360-FANTO-QuestPro-APK
          path: mobile/build/app/outputs/flutter-apk/app-quest-release.apk
          retention-days: 7
